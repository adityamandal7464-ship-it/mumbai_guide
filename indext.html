<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumbai Explorer</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            box-sizing: border-box
        }
        
        :root {
            --primary: #075d6b;
            --blue: #0b8da3;
            --orange: #e67e22;
            --red: #e74c3c;
            --light: #edf5f7;
            --muted: #607684;
        }
        
        html,
        body {
            margin: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background: var(--light);
            color: #20323a;
        }
        
        body {
            overflow: hidden
        }
        
        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            color: white;
            background: linear-gradient(135deg, #075d6b, #0b8da3);
            position: relative;
            z-index: 1000;
        }
        
        header h1 {
            margin: 0;
            font-size: 23px
        }
        
        header p {
            margin: 4px 0 0;
            font-size: 12px;
            opacity: .9
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #language {
            padding: 8px;
            border: 0;
            border-radius: 7px;
            color: var(--primary);
            font-weight: bold;
        }
        
        .logo {
            padding: 8px 12px;
            border-radius: 18px;
            background: #ffffff25;
            font-weight: bold;
        }
        
        #map {
            position: absolute;
            top: 70px;
            left: 0;
            right: 420px;
            bottom: 0;
        }
        
        .sidebar {
            position: absolute;
            top: 70px;
            right: 0;
            width: 420px;
            height: calc(100vh - 70px);
            padding: 15px;
            overflow-y: auto;
            background: white;
            box-shadow: -4px 0 16px #0002;
            z-index: 500;
        }
        
        .search input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd8de;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        button {
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        
        .location-btn {
            width: 100%;
            padding: 11px;
            border: 0;
            border-radius: 8px;
            background: var(--orange);
            color: white;
            margin-bottom: 10px;
        }
        
        .status {
            display: none;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid var(--orange);
            border-radius: 7px;
            background: #fff4dc;
            color: #704500;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .tabs {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            margin: 10px 0;
        }
        
        .tab {
            flex: 0 0 auto;
            padding: 8px 11px;
            border: 1px solid #ccd8de;
            border-radius: 20px;
            background: white;
            color: #36525d;
            font-size: 12px;
        }
        
        .tab.active {
            background: var(--primary);
            color: white;
        }
        
        .filters {
            display: flex;
            gap: 7px;
            margin-bottom: 12px;
        }
        
        .filters select {
            width: 50%;
            padding: 10px;
            border: 1px solid #ccd8de;
            border-radius: 8px;
            background: white;
        }
        
        .card {
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #e1eaed;
            border-radius: 10px;
            background: white;
            box-shadow: 0 2px 5px #0000000b;
        }
        
        .card h3 {
            margin: 5px 0 7px;
            color: var(--primary);
            font-size: 17px;
        }
        
        .card p {
            margin: 5px 0;
            color: #405b66;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .badge,
        .count {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .badge {
            background: #e6f6f8;
            color: var(--primary);
        }
        
        .count {
            margin-top: 5px;
            background: #fff0d2;
            color: #965600;
        }
        
        .actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }
        
        .small-btn {
            flex: 1;
            padding: 9px 6px;
            border: 0;
            border-radius: 8px;
            background: var(--blue);
            color: white;
            font-size: 12px;
        }
        
        .route-btn {
            background: var(--red);
        }
        
        .selected-card {
            border: 2px solid var(--primary);
            background: #f4fcfd;
        }
        
        .inline-details {
            display: none;
            margin-top: 13px;
            padding: 14px;
            border-left: 4px solid var(--blue);
            border-radius: 8px;
            background: #f2fbfd;
            scroll-margin-top: 15px;
        }
        
        .inline-details.open {
            display: block;
        }
        
        .inline-details h4 {
            margin: 0 0 9px;
            color: var(--primary);
            font-size: 18px;
        }
        
        .inline-details h5 {
            margin: 13px 0 6px;
            color: var(--primary);
            font-size: 15px;
        }
        
        .inline-details p {
            margin: 7px 0;
            color: #3c5965;
            font-size: 13px;
            line-height: 1.55;
        }
        
        .inline-details button {
            width: 100%;
            padding: 9px;
            margin-top: 8px;
            border: 0;
            border-radius: 7px;
            background: var(--blue);
            color: white;
        }
        
        .venue {
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #dce7e9;
            border-radius: 8px;
            background: white;
        }
        
        .venue h5 {
            margin: 0 0 7px;
            color: var(--primary);
        }
        
        .venue p {
            font-size: 12px;
            line-height: 1.5;
        }
        
        .tip {
            padding: 9px;
            border-radius: 7px;
            background: #e9f8fa;
            color: var(--primary);
            font-size: 12px;
            line-height: 1.5;
        }
        
        .empty {
            padding: 15px;
            text-align: center;
            color: var(--muted);
        }
        
        .section-title {
            padding-bottom: 8px;
            border-bottom: 2px solid var(--blue);
            color: var(--primary);
        }
        
        .legend {
            padding: 9px;
            border-radius: 8px;
            background: #fffffff2;
            box-shadow: 0 1px 5px #0003;
            font-size: 12px;
            line-height: 1.7;
        }
        
        .legend span {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 5px;
            border-radius: 50%;
        }
        
        @media(max-width:900px) {
            body {
                overflow: auto
            }
            header {
                height: 64px;
                padding: 0 12px;
            }
            header h1 {
                font-size: 18px
            }
            header p {
                font-size: 10px
            }
            .logo {
                display: none
            }
            #map {
                position: relative;
                top: 0;
                right: 0;
                width: 100%;
                height: 52vh;
            }
            .sidebar {
                position: relative;
                top: 0;
                width: 100%;
                height: auto;
                box-shadow: none;
            }
        }
    </style>
</head>

        function getFilteredPlaces() {
            const query = searchInput.value.toLowerCase().trim();
            const category = categoryFilter.value;
            const month = monthFilter.value;

            return places.filter(place => {
                const matchesText =
                    `${place.name} ${place.address} ${place.description}`
                    .toLowerCase()
                    .includes(query);

                const matchesCategory =
                    category === "all" || place.category === category;

                const matchesMonth =
                    month === "all" || place.months.includes(Number(month));

                return matchesText && matchesCategory && matchesMonth;
            });
        }

        function getLocation() {
            if (!navigator.geolocation) {
                showStatus("Aapka browser GPS support nahi karta.");
                return;
            }

            showStatus("Current location find ki ja rahi hai...");

            navigator.geolocation.getCurrentPosition(
                position => {
                    currentLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    if (currentMarker) {
                        map.removeLayer(currentMarker);
                    }

                    currentMarker = L.marker([
                            currentLocation.lat,
                            currentLocation.lng
                        ])
                        .addTo(map)
                        .bindPopup("📍 Aapki current location")
                        .openPopup();

                    map.setView([
                        currentLocation.lat,
                        currentLocation.lng
                    ], 14);

                    showStatus("Aapki current location map par show ho rahi hai.");
                },
                () => {
                    showStatus("Location permission allow karein.");
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        async function calculateRoute(placeId) {
            const place = places.find(item => item.id === placeId);

            if (!place) return;

            if (!currentLocation) {
                showStatus("Route ke liye pehle current location button press karein.");
                return;
            }

            try {
                showStatus("Route calculate ho raha hai...");

                const start = `${currentLocation.lng},${currentLocation.lat}`;
                const end = `${place.lng},${place.lat}`;

                const url =
                    `https://router.project-osrm.org/route/v1/driving/` +
                    `${start};${end}?overview=full&geometries=geojson`;

                const response = await fetch(url);
                const data = await response.json();

                if (!data.routes || !data.routes.length) {
                    showStatus("Route nahi mila.");
                    return;
                }

                const route = data.routes[0];

                if (routeLine) {
                    map.removeLayer(routeLine);
                }

                routeLine = L.geoJSON(route.geometry, {
                    style: {
                        color: "#e74c3c",
                        weight: 6,
                        opacity: .9
                    }
                }).addTo(map);

                map.fitBounds(routeLine.getBounds(), {
                    padding: [30, 30]
                });

                const distance = (route.distance / 1000).toFixed(1);
                const time = Math.round(route.duration / 60);

                showStatus(
                    `<strong>${place.name}</strong><br>` +
                    `Distance: ${distance} km<br>` +
                    `Estimated time: ${time} minutes`
                );
            } catch (error) {
                showStatus("Route service temporarily unavailable hai.");
            }
        }

        function focusVenue(lat, lng, name) {
            map.setView([lat, lng], 16);

            L.popup()
                .setLatLng([lat, lng])
                .setContent(`<strong>📍 ${name}</strong>`)
                .openOn(map);
        }

        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => {
                setTab(tab.dataset.tab);
            });
        });

        searchInput.addEventListener("input", () => {
            if (activeTab === "places") renderPlaces();
        });

        categoryFilter.addEventListener("change", () => {
            if (activeTab === "places") renderPlaces();
        });

        monthFilter.addEventListener("change", () => {
            if (activeTab === "places") renderPlaces();
        });

        document.getElementById("language").addEventListener("change", updateLanguage);
        document.getElementById("locationButton").addEventListener("click", getLocation);

        const legend = L.control({
            position: "bottomleft"
        });

        legend.onAdd = function() {
            const div = L.DomUtil.create("div", "legend");

            div.innerHTML = `
    <strong>Categories</strong><br>
    <span style="background:#8e44ad"></span> Historical<br>
    <span style="background:#2980b9"></span> Beach<br>
    <span style="background:#27ae60"></span> Nature<br>
    <span style="background:#c0392b"></span> Religious<br>
    <span style="background:#f39c12"></span> Festival
  `;

            return div;
        };

        legend.addTo(map);
        renderPlaces();
    </script>

</body>
