<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumbai Explorer</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="brand">
            <h1 id="appTitle">📍 Mumbai Explorer</h1>
            <p id="appSubtitle">
                Mumbai travel, festivals, food aur hotel guide
            </p>
        </div>

        <div class="header-actions">
            <select id="languageSelect">
        <option value="hinglish">Hinglish</option>
        <option value="hindi">हिन्दी</option>
        <option value="marathi">मराठी</option>
        <option value="english">English</option>
      </select>

            <span class="logo">मुंबई</span>
        </div>
    </header>

    <main>
        <div id="map"></div>

        <aside class="sidebar">
            <div class="search-box">
                <input id="searchInput" type="search" placeholder="Mumbai me place search karein">
            </div>

            <button id="locationButton" class="location-button">
        📍 Meri Current Location Dhoondein
      </button>

            <div id="statusBox" class="status-box"></div>

            <nav class="tabs">
                <button class="tab active" data-tab="places">Places</button>
                <button class="tab" data-tab="festivals">Festivals</button>
                <button class="tab" data-tab="food">Food</button>
                <button class="tab" data-tab="hotels">Hotels</button>
                <button class="tab" data-tab="guide">Guide</button>
            </nav>

            <div id="filters" class="filters">
                <select id="categoryFilter">
          <option value="all">All categories</option>
          <option value="historic">Historical</option>
          <option value="beach">Beach</option>
          <option value="religious">Religious</option>
          <option value="nature">Nature</option>
          <option value="museum">Museum</option>
          <option value="market">Market</option>
          <option value="viewpoint">Viewpoint</option>
          <option value="tourist">Tourist</option>
        </select>

                <select id="monthFilter">
          <option value="all">Any month</option>
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
            </div>

            <section id="content"></section>

            <!-- Details always appear after the selected card/list -->
            <section id="details" class="details"></section>
        </aside>
    </main>

    <div id="photoModal" class="photo-modal">
        <button id="closePhoto" class="close-photo">&times;</button>
        <img id="modalImage" src="" alt="Mumbai image">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
